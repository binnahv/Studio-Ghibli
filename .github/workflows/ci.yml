name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  # Monta e envia o site; só roda fora de pull requests e depois dos testes
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Monta a pasta do site
        run: mkdir _site && cp -r index.html manifest.json service-worker.js css js img _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Publica no GitHub Pages o pacote enviado pelo job build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
