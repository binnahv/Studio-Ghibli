<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Ghibli | Filmes</title>
  <meta name="description" content="Explore os filmes do Studio Ghibli: busque por título, diretor, ano ou nota.">
  <meta name="theme-color" content="#4a7fb5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero" id="hero">
    <h1>Studio Ghibli</h1>
    <p>Explorando a API do estúdio</p>
  </header>

  <main class="container">
    <div class="search-bar mb-2">
      <div class="input-group">
        <select id="search-field" class="form-select search-field" aria-label="Buscar por">
          <option value="title" selected>Título</option>
          <option value="director">Diretor</option>
          <option value="year">Ano</option>
          <option value="score">Nota</option>
        </select>
        <input type="text" id="search" class="form-control" placeholder="Ex.: Totoro" aria-label="Buscar filmes">
        <button class="btn btn-primary" id="search-button" type="button" aria-label="Buscar">
          <i class="bi bi-search-heart"></i>
        </button>
      </div>
    </div>
    <p id="results-info" class="results-info" aria-live="polite"></p>
    <div id="spinner" class="d-flex justify-content-center my-5 d-none">
      <div class="spinner-border" role="status" aria-label="Carregando"></div>
    </div>
    <div id="error" class="alert alert-danger d-none" role="alert">
      Não foi possível carregar os filmes. Verifique sua conexão e tente novamente.
    </div>
    <div class="films-list row g-4"></div>
    <nav id="pagination" class="mt-4" aria-label="Paginação dos filmes"></nav>
  </main>

  <div class="modal fade" id="filmModal" tabindex="-1" aria-labelledby="filmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="filmModalLabel">Detalhes do filme</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <img id="modalFilmImage" src="img/fallback.svg" alt="" class="img-fluid mb-3">
          <p><i class="bi bi-person icon"></i> <strong>Diretor:</strong> <span id="modalFilmDirector"></span></p>
          <p><i class="bi bi-calendar-check icon"></i> <strong>Ano:</strong> <span id="modalFilmYear"></span></p>
          <p><i class="bi bi-star icon"></i> <strong>Rotten Tomatoes:</strong> <span id="modalFilmScore"></span></p>
          <p id="modalFilmDescription"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
